name: Release Build

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package Extension (7z)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install p7zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Install dependencies
        run: npm install

      - name: Build extension
        run: npm run build

      - name: Compress dist directory to 7z
        run: |
          7z a -t7z "DSA-SyncFlow-${{ github.ref_name }}.7z" ./dist/*

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: DSA-SyncFlow-${{ github.ref_name }}.7z
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
